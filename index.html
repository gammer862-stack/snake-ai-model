<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake AI - TensorFlow.js</title>
    <!-- បណ្ណាល័យ TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; padding: 10px; }
        canvas { background-color: #111; border: 4px solid #555; margin-top: 15px; max-width: 100%; height: auto; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Snake AI (Deep Q-Learning)</h1>
    <div id="status">កំពុងភ្ជាប់អ៊ីនធឺណិត និងផ្ទុក Model...</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const gridCount = 20; 
const gridSize = canvas.width / gridCount;

let snake = [[5, 5], [5, 6], [5, 7]];
let food = [Math.floor(Math.random()*gridCount), Math.floor(Math.random()*gridCount)];
let direction = 0; 
let model;

// មុខងារផ្ទុក Model ពី GitHub របស់អ្នកផ្លូវការ
async function loadModel() {
    try {
        // Update this with your actual model URL
        const modelUrl = 'https://raw.githubusercontent.com/gammer862-stack/snake-ai-model/main/model.json';
        model = await tf.loadLayersModel(modelUrl); 
        document.getElementById("status").style.color = "#00ff00";
        document.getElementById("status").innerText = "បានផ្ទុក Model ជោគជ័យ! AI កំពុងលេង...";
        setInterval(gameLoop, 100); 
    } catch (error) {
        document.getElementById("status").style.color = "#ff3333";
        document.getElementById("status").innerText = "ការផ្ទុក Model បរាជ័យ: " + error.message;
        console.error(error);
    }
}

function getState() {
    let head = snake[0];
    let pL = [head[0] - 1, head[1]], pR = [head[0] + 1, head[1]];
    let pU = [head[0], head[1] - 1], pD = [head[0], head[1] + 1];
    
    let dU = direction === 0, dD = direction === 1, dL = direction === 2, dR = direction === 3;

    function isCollision(p) {
        if (p[0] < 0 || p[0] >= gridCount || p[1] < 0 || p[1] >= gridCount) return 1;
        for (let cell of snake) { if (cell[0] === p[0] && cell[1] === p[1]) return 1; }
        return 0;
    }

    return [
        (dR && isCollision(pR)) || (dL && isCollision(pL)) || (dU && isCollision(pU)) || (dD && isCollision(pD)) ? 1 : 0,
        (dU && isCollision(pR)) || (dD && isCollision(pL)) || (dL && isCollision(pU)) || (dR && isCollision(pD)) ? 1 : 0,
        (dD && isCollision(pR)) || (dU && isCollision(pL)) || (dR && isCollision(pU)) || (dL && isCollision(pD)) ? 1 : 0,
        dL ? 1 : 0, dR ? 1 : 0, dU ? 1 : 0, dD ? 1 : 0,
        food[0] < head[0] ? 1 : 0, food[0] > head[0] ? 1 : 0,
        food[1] < head[1] ? 1 : 0, food[1] > head[1] ? 1 : 0
    ];
}

async function gameLoop() {
    const stateArray = getState();
    const inputTensor = tf.tensor2d([stateArray], [1, 11]);
    const prediction = model.predict(inputTensor);
    const action = prediction.argMax(1).dataSync()[0]; 
    
    inputTensor.dispose();
    prediction.dispose();

    const clockWise = [0, 1, 2, 3];
    let idx = clockWise.indexOf(direction);
    if (action === 1) direction = clockWise[(idx + 1) % 4];
    else if (action === 2) direction = clockWise[(idx - 1 + 4) % 4];

    let head = [...snake[0]];
    if (direction === 0) head[1]--;
    else if (direction === 1) head[1]++;
    else if (direction === 2) head[0]--;
    else if (direction === 3) head[0]++;

    if (head[0] < 0 || head[0] >= gridCount || head[1] < 0 || head[1] >= gridCount || 
        snake.some(c => c[0] === head[0] && c[1] === head[1])) {
        snake = [[5, 5], [5, 6], [5, 7]];
        direction = 0;
        return;
    }

    snake.unshift(head);

    if (head[0] === food[0] && head[1] === food[1]) {
        food = [Math.floor(Math.random()*gridCount), Math.floor(Math.random()*gridCount)];
    } else {
        snake.pop();
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "red";
    ctx.fillRect(food[0]*gridSize, food[1]*gridSize, gridSize-2, gridSize-2); 

    ctx.fillStyle = "lime";
    for(let cell of snake) {
        ctx.fillRect(cell[0]*gridSize, cell[1]*gridSize, gridSize-2, gridSize-2); 
    }
}

loadModel();
</script>
</body>
</html>
